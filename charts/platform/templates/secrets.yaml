{{- $s := .Values.secrets -}}
# Only the gateway mounts gateway-secrets. The upstream credentials enter the system here once (seed-servers)
# and are stored in Postgres; the gateway never sends them to a browser or an MCP client.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-secrets
  labels: {{- include "platform.labels" (dict "name" "gateway" "root" .) | nindent 4 }}
type: Opaque
stringData:
  session-secret: {{ required "secrets.sessionSecret is required (run make secrets)" $s.sessionSecret | quote }}
  admin-password: {{ required "secrets.adminPassword is required (run make secrets)" $s.adminPassword | quote }}
  llm-api-key: {{ $s.llmApiKey | default "" | quote }}
  seed-servers: {{ include "platform.seedServers" . | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  labels: {{- include "platform.labels" (dict "name" "postgres" "root" .) | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "secrets.postgresPassword is required (run make secrets)" $s.postgresPassword | quote }}
