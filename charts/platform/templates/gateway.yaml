apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: {{- include "platform.labels" (dict "name" "gateway" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels: {{- include "platform.labels" (dict "name" "gateway" "root" .) | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false   # the gateway never talks to the Kubernetes API
      containers:
        - name: gateway
          image: {{ .Values.gateway.image }}
          imagePullPolicy: {{ .Values.gateway.pullPolicy }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres, key: password } }
            - name: DATABASE_URL
              value: postgresql+asyncpg://gateway:$(POSTGRES_PASSWORD)@postgres:5432/gateway
            - name: SESSION_SECRET
              valueFrom: { secretKeyRef: { name: gateway-secrets, key: session-secret } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: gateway-secrets, key: admin-password } }
            - name: SEED_SERVERS
              valueFrom: { secretKeyRef: { name: gateway-secrets, key: seed-servers } }
            - { name: ADMIN_EMAIL, value: {{ .Values.gateway.adminEmail | quote }} }
            - { name: PUBLIC_URL, value: {{ .Values.publicUrl | quote }} }
            - { name: COOKIE_SECURE, value: {{ .Values.gateway.cookieSecure | quote }} }
            - { name: UPSTREAM_CALL_TIMEOUT_S, value: {{ .Values.gateway.upstreamCallTimeoutSeconds | quote }} }
            - { name: UPSTREAM_PROBE_TIMEOUT_S, value: {{ .Values.gateway.upstreamProbeTimeoutSeconds | quote }} }
            - { name: HEALTH_INTERVAL_S, value: {{ .Values.gateway.healthIntervalSeconds | quote }} }
          ports:
            - { name: http, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: /readyz, port: http }   # includes a database ping
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }  # the process only; a database blip must not restart us
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 4
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
          securityContext: {{- include "platform.restricted" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }   # the root filesystem is read-only
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: {{- include "platform.labels" (dict "name" "gateway" "root" .) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
