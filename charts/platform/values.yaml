# Defaults shared by every environment. values-local.yaml / values-prod.yaml override what differs;
# secrets come from deploy/secrets/platform.yaml (generated by `make secrets`, git-ignored).

host: dashboard.localhost            # Ingress host for the dashboard, /api and /mcp
publicUrl: http://dashboard.localhost

ingress:
  className: traefik
  annotations: {}
  tls:
    enabled: false
    secretName: dashboard-tls

storage:
  className: ""                      # "" = the cluster's default class

gateway:
  image: urumi/gateway:dev           # local builds override this with a fresh tag (make deploy)
  pullPolicy: IfNotPresent
  replicas: 1
  cookieSecure: false
  adminEmail: admin@example.com
  upstreamCallTimeoutSeconds: 30
  upstreamProbeTimeoutSeconds: 5
  healthIntervalSeconds: 10
  # SSRF guard: upstream URLs may not point at internal addresses (metadata, localhost, private networks, other
  # cluster services), except these host names: our own in-cluster MCP services. Not editable from the dashboard.
  internalUpstreamHosts:
    - woo-mcp.store.svc.cluster.local
    - notes-mcp.tools.svc.cluster.local
  storeTimezone: UTC                # the chat agent's idea of "today"; keep it equal to the store's timezone
  llm:                               # the chat agent's model: any OpenAI-compatible endpoint with tool calling
    baseUrl: ""                      # e.g. https://provider.example/v1 (make secrets copies it from .env)
    model: ""
  resources:
    requests: { cpu: 100m, memory: 160Mi }
    limits: { cpu: 500m, memory: 384Mi }

dashboard:
  image: urumi/dashboard:dev         # local builds override this with a fresh tag (make deploy)
  pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 200m, memory: 96Mi }

postgres:
  image: postgres:16-alpine
  uid: 70                            # the image's postgres user; the pod runs as it, never as root
  size: 1Gi
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 500m, memory: 384Mi }

# Registered on the gateway's first start, in this order (WooCommerce first). After that the dashboard owns
# them: edits made there are never overwritten. Credentials are looked up in secrets.<credentialSecretKey>.
# adminOnlyTools: tools only admins may list and call (members can read orders, but not create products or
# change order status). Admins change the list on the Servers page afterwards.
seedServers:
  - slug: woo
    name: WooCommerce store
    url: http://woo-mcp.store.svc.cluster.local:8000/mcp
    authType: bearer
    credentialSecretKey: wooMcpToken
    adminOnlyTools: [create_product, update_order_status]
  - slug: notes
    name: Team notes
    url: http://notes-mcp.tools.svc.cluster.local:8000/mcp
    authType: bearer
    credentialSecretKey: notesMcpToken
  - slug: deepwiki
    name: DeepWiki (public)
    url: https://mcp.deepwiki.com/mcp
    authType: none

networkPolicy:
  enabled: true
  ingressControllerNamespace: kube-system

# Rendered into Secrets. The chart refuses to install while a required one is empty.
secrets:
  sessionSecret: ""
  adminPassword: ""
  postgresPassword: ""
  llmApiKey: ""                      # optional: until it is set, the chat page says it isn't configured
  wooMcpToken: ""
  notesMcpToken: ""
