# Defaults shared by every environment. values-local.yaml / values-prod.yaml override what differs;
# secrets come from deploy/secrets/platform.yaml (generated by `make secrets`, git-ignored).

host: dashboard.localhost            # Ingress host for the dashboard, /api and /mcp
publicUrl: http://dashboard.localhost

ingress:
  className: traefik
  annotations: {}
  tls:
    enabled: false
    secretName: dashboard-tls

storage:
  className: ""                      # "" = the cluster's default class

gateway:
  image: urumi/gateway:dev           # local builds override this with a fresh tag (make deploy)
  pullPolicy: IfNotPresent
  replicas: 1
  cookieSecure: false
  adminEmail: admin@example.com
  upstreamCallTimeoutSeconds: 30
  upstreamProbeTimeoutSeconds: 5
  healthIntervalSeconds: 10
  resources:
    requests: { cpu: 100m, memory: 160Mi }
    limits: { cpu: 500m, memory: 384Mi }

postgres:
  image: postgres:16-alpine
  size: 1Gi
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 500m, memory: 384Mi }

# Registered on the gateway's first start, in this order (WooCommerce first). After that the dashboard owns
# them: edits made there are never overwritten. Credentials are looked up in secrets.<credentialSecretKey>.
seedServers:
  - slug: woo
    name: WooCommerce store
    url: http://woo-mcp.store.svc.cluster.local:8000/mcp
    authType: bearer
    credentialSecretKey: wooMcpToken
  - slug: notes
    name: Team notes
    url: http://notes-mcp.tools.svc.cluster.local:8000/mcp
    authType: bearer
    credentialSecretKey: notesMcpToken
  - slug: deepwiki
    name: DeepWiki (public)
    url: https://mcp.deepwiki.com/mcp
    authType: none

networkPolicy:
  enabled: true
  ingressControllerNamespace: kube-system

# Rendered into Secrets. The chart refuses to install while a required one is empty.
secrets:
  sessionSecret: ""
  adminPassword: ""
  postgresPassword: ""
  wooMcpToken: ""
  notesMcpToken: ""
