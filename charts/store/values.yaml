# Defaults shared by every environment. values-local.yaml / values-prod.yaml override what differs;
# secrets come from deploy/secrets/store.yaml (generated by `make secrets`, git-ignored).

store:
  host: store.localhost            # Ingress host of the storefront
  url: http://store.localhost      # WordPress site URL (scheme + host)
  title: Urumi Demo Store
  adminUser: admin
  adminEmail: admin@example.com
  timezone: UTC                    # "orders today" is computed in this timezone
  currency: USD

ingress:
  className: traefik               # k3d and k3s both ship Traefik
  annotations: {}
  tls:
    enabled: false
    secretName: store-tls

storage:
  className: ""                    # "" = the cluster's default class (local-path on k3d/k3s)

mariadb:
  image: mariadb:11.4
  size: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

wordpress:
  image: wordpress:php8.3-apache
  size: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }

setup:
  image: wordpress:cli
  wooCommerceVersion: ""           # "" = latest compatible; pin a version for reproducible installs
  sampleProducts: true
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }

# Rendered into Kubernetes Secrets. The chart refuses to install while any of them is empty.
secrets:
  dbRootPassword: ""
  dbPassword: ""
  adminPassword: ""
  wooConsumerKey: ""               # must start with ck_
  wooConsumerSecret: ""            # must start with cs_
  mcpToken: ""                     # the gateway presents this to the MCP server
