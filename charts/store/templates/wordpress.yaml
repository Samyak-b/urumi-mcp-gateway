apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-data
  labels: {{- include "store.labels" (dict "name" "wordpress" "root" .) | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # `helm uninstall` never deletes the store's files and uploads
spec:
  accessModes: ["ReadWriteOnce"]
  {{- include "store.storageClass" . | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.wordpress.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  labels: {{- include "store.labels" (dict "name" "wordpress" "root" .) | nindent 4 }}
spec:
  replicas: 1
  # The volume is ReadWriteOnce: stop the old pod before starting the new one, so an upgrade never
  # leaves the new pod waiting for a volume the old one still holds (on a multi-node cluster).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wordpress
  template:
    metadata:
      labels: {{- include "store.labels" (dict "name" "wordpress" "root" .) | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: wordpress
          image: {{ .Values.wordpress.image }}
          # On first start the image copies WordPress into the empty volume and writes wp-config.php
          # from these variables. The database is reached by its Service name.
          env:
            - { name: WORDPRESS_DB_HOST, value: "mariadb:3306" }
            - { name: WORDPRESS_DB_USER, value: wordpress }
            - { name: WORDPRESS_DB_NAME, value: wordpress }
            - name: WORDPRESS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: store-db, key: password } }
          ports:
            - { name: http, containerPort: 80 }
          # Ready = PHP answers and reaches the database (wp-login.php gives a 500 without it; a redirect
          # to the installer counts as success). Alive = Apache accepts connections; a database outage
          # must not restart WordPress.
          readinessProbe:
            httpGet: { path: /wp-login.php, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources: {{- toYaml .Values.wordpress.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/www/html }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wordpress-data
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  labels: {{- include "store.labels" (dict "name" "wordpress" "root" .) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: wordpress
  ports:
    - name: http
      port: 80
      targetPort: http
---
# The storefront's public entry: every path on the store host goes to WordPress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storefront
  labels: {{- include "store.labels" (dict "name" "wordpress" "root" .) | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.store.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.store.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress
                port: { name: http }
