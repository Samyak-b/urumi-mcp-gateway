apiVersion: v1
kind: ConfigMap
metadata:
  name: store-setup
  labels: {{- include "store.labels" (dict "name" "store-setup" "root" .) | nindent 4 }}
data:
  setup.sh: |
{{ .Files.Get "files/setup.sh" | indent 4 }}
---
# Runs after every install and upgrade; Helm waits for it. The script is idempotent, so re-running is safe.
apiVersion: batch/v1
kind: Job
metadata:
  name: store-setup
  labels: {{- include "store.labels" (dict "name" "store-setup" "root" .) | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation   # keep the last run's pod and logs until the next one
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels: {{- include "store.labels" (dict "name" "store-setup" "root" .) | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        # wordpress:cli is Alpine, where www-data is uid 82; the files on the volume belong to the
        # Debian-based WordPress image's www-data, uid 33. Run as 33 so plugin installs can write.
        runAsUser: 33
        runAsGroup: 33
        runAsNonRoot: true
      containers:
        - name: setup
          image: {{ .Values.setup.image }}
          command: ["sh", "/scripts/setup.sh"]
          env:
            - { name: HOME, value: /tmp }
            - { name: WP_CLI_CACHE_DIR, value: /tmp/wp-cli-cache }
            - { name: WP_CLI_PHP_ARGS, value: "-d memory_limit=512M" }
            - { name: WORDPRESS_DB_HOST, value: "mariadb:3306" }
            - { name: WORDPRESS_DB_USER, value: wordpress }
            - { name: WORDPRESS_DB_NAME, value: wordpress }
            - name: WORDPRESS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: store-db, key: password } }
            - { name: WP_HOME_URL, value: {{ .Values.store.url | quote }} }
            - { name: STORE_TITLE, value: {{ .Values.store.title | quote }} }
            - { name: STORE_TIMEZONE, value: {{ .Values.store.timezone | quote }} }
            - { name: STORE_CURRENCY, value: {{ .Values.store.currency | quote }} }
            - { name: WP_ADMIN_USER, value: {{ .Values.store.adminUser | quote }} }
            - { name: WP_ADMIN_EMAIL, value: {{ .Values.store.adminEmail | quote }} }
            - name: WP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: store-admin, key: password } }
            - { name: WC_VERSION, value: {{ .Values.setup.wooCommerceVersion | quote }} }
            - { name: SAMPLE_PRODUCTS, value: {{ .Values.setup.sampleProducts | quote }} }
            - name: WOO_CONSUMER_KEY
              valueFrom: { secretKeyRef: { name: store-mcp, key: consumer-key } }
            - name: WOO_CONSUMER_SECRET
              valueFrom: { secretKeyRef: { name: store-mcp, key: consumer-secret } }
          resources: {{- toYaml .Values.setup.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/www/html }
            - { name: scripts, mountPath: /scripts }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wordpress-data
        - name: scripts
          configMap:
            name: store-setup
