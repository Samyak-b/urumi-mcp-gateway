# Values come from deploy/secrets/store.yaml (generated, git-ignored). `required` makes the install fail
# loudly instead of starting a database with an empty password.
apiVersion: v1
kind: Secret
metadata:
  name: store-db
  labels: {{- include "store.labels" (dict "name" "mariadb" "root" .) | nindent 4 }}
type: Opaque
stringData:
  root-password: {{ required "secrets.dbRootPassword is required (run make secrets)" .Values.secrets.dbRootPassword | quote }}
  password: {{ required "secrets.dbPassword is required (run make secrets)" .Values.secrets.dbPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: store-admin
  labels: {{- include "store.labels" (dict "name" "wordpress" "root" .) | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "secrets.adminPassword is required (run make secrets)" .Values.secrets.adminPassword | quote }}
