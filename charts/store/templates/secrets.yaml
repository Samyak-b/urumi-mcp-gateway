# Values come from deploy/secrets/store.yaml (generated, git-ignored). `required` makes the install fail
# loudly instead of starting a database with an empty password.
apiVersion: v1
kind: Secret
metadata:
  name: store-db
  labels: {{- include "store.labels" (dict "name" "mariadb" "root" .) | nindent 4 }}
type: Opaque
stringData:
  root-password: {{ required "secrets.dbRootPassword is required (run make secrets)" .Values.secrets.dbRootPassword | quote }}
  password: {{ required "secrets.dbPassword is required (run make secrets)" .Values.secrets.dbPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: store-admin
  labels: {{- include "store.labels" (dict "name" "wordpress" "root" .) | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "secrets.adminPassword is required (run make secrets)" .Values.secrets.adminPassword | quote }}
---
# The MCP server's credentials: its WooCommerce REST API key, and the token the gateway must present.
apiVersion: v1
kind: Secret
metadata:
  name: store-mcp
  labels: {{- include "store.labels" (dict "name" "woo-mcp" "root" .) | nindent 4 }}
type: Opaque
stringData:
  consumer-key: {{ required "secrets.wooConsumerKey is required (run make secrets)" .Values.secrets.wooConsumerKey | quote }}
  consumer-secret: {{ required "secrets.wooConsumerSecret is required (run make secrets)" .Values.secrets.wooConsumerSecret | quote }}
  mcp-token: {{ required "secrets.mcpToken is required (run make secrets)" .Values.secrets.mcpToken | quote }}
