# Serves the built React app. /api and /mcp never reach this container: the Ingress sends them to the gateway.
server {
  listen 8080;
  root /usr/share/nginx/html;
  location = /healthz { access_log off; return 200 "ok\n"; }
  location /assets/ { expires 7d; add_header Cache-Control "public, immutable"; }   # file names carry a hash
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-store";
    add_header X-Frame-Options "DENY";              # no embedding in other sites (clickjacking)
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer";       # invite tokens are in the URL; don't leak them to other sites
  }
}
